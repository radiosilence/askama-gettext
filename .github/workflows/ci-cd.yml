name: CI/CD

# CI checks the change and ends in `Checks`, the one status the ruleset
# requires. Each job runs only for the domains the change touches (see
# `changes`); a skipped job passes `Checks`, a failed or cancelled one fails
# it, so jobs can be added, renamed or skipped without touching branch
# protection.
#
# CD runs on main after `Checks`, and only for a release: a push that changes
# the version, or a manual run, which releases whatever version is not out yet
# and is how a failed release is retried. It publishes the crate, then the
# GitHub release.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A pull request's newer push cancels its older run. Runs on main are never
# cancelled: one may be publishing, and a crate version cannot be taken back
# half way.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────

  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      deps: ${{ steps.filter.outputs.deps }}
      release: ${{ steps.filter.outputs.release }}
      version: ${{ steps.filter.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        # A pull request runs the domains its diff against its base touches.
        # A push to main or a manual run checks everything: the crate is small,
        # and main is what a release is cut from.
        #
        # Allowlists, so the question is "did any source of this domain
        # change?" rather than "was everything recognisably irrelevant?".
        # Markdown is documentation wherever it sits.
        #
        # Steps run under `bash -e`, where grep finding nothing is a failing
        # command rather than an answer, so every question is asked in a
        # condition.
        run: |
          rust=true deps=true release=false
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          version=$(version_of < Cargo.toml)
          bumped=false
          # Against the commit before, not the diff base: a push landing while
          # a release run is still going would otherwise see the same bump and
          # release it again. A bump that is not the head commit is released
          # by a manual run.
          if [ "$(git show HEAD^1:Cargo.toml 2>/dev/null | version_of)" != "$version" ]; then
            bumped=true
          fi
          case "$EVENT" in
            pull_request)
              case "$HEAD_REF" in release-v*) bumped=true ;; esac
              release=$bumped
              ;;
            *)
              # Only a 404 means the version is not out. Any other failure
              # stops the run: guessing either way releases twice or never.
              if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] || [ "$bumped" = true ]; }; then
                if ! out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
                  if printf '%s' "$out" | grep -q 'HTTP 404'; then
                    release=true
                  else
                    echo "::error::cannot tell whether v$version is released: $out"
                    exit 1
                  fi
                fi
              fi
              ;;
          esac
          touches() { printf '%s\n' "$files" | grep -E "$1" | grep -qvE '\.md$'; }
          if [ "$EVENT" = pull_request ] && [ "$release" != true ] && files=$(git diff --name-only "$BASE_SHA" HEAD); then
            echo "changes against the base:"
            printf '%s\n' "$files" | sed 's/^/  /'
            # Anything cargo compiles or packages, or that decides how.
            touches '^LICENSE|^src/|^tests/|^templates/|^Cargo\.(toml|lock)$|^\.cargo/|^rust-toolchain|^\.github/' || rust=false
            # What the advisory audit reads.
            touches '^Cargo\.(toml|lock)$|^deny\.toml$|^\.github/' || deps=false
          fi
          {
            echo "rust=$rust"
            echo "deps=$deps"
            echo "release=$release"
            echo "version=$version"
          } | tee -a "$GITHUB_OUTPUT"

  format:
    name: Format
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No cache: formatting compiles nothing.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy, the tests (doctests included) and the docs on one runner, sharing
  # one target directory and one cache. Each runs however an earlier one went,
  # so one push reports every failure.
  rust:
    name: Rust
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
          components: clippy
      - id: cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: stable
          # A failing check would otherwise leave the cache unsaved.
          cache-on-failure: true
      - run: cargo clippy --locked --all-targets -- -D warnings
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --locked --no-fail-fast
      # What docs.rs will build, with broken intra-doc links as errors.
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps

  # The `rust-version` in Cargo.toml is a promise to dependents, so the crate
  # and its tests are built on exactly that toolchain.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: msrv
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: msrv
          cache-on-failure: true
      - run: cargo check --locked --all-targets

  # What `cargo publish` uploads, built as crates.io will see it: a file left
  # out of `include`, or a dependency that only resolves locally, fails here
  # rather than in the middle of a release.
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: package
          cache-on-failure: true
      - run: cargo publish --dry-run --locked
      # `cargo publish` unpacks the crate under target/package, which the
      # cache step's clean-up trips over.
      - if: always()
        run: rm -rf target/package

  # A release pull request's version against the newest one on crates.io: a
  # public API change the bump does not allow for fails here, before it is
  # published under the wrong version. Skipped until a first version exists to
  # compare with.
  semver:
    name: Semver
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.release == 'true'
    timeout-minutes: 30
    steps:
      - id: published
        run: |
          if curl -sf https://index.crates.io/as/ka/askama_gettext >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::askama_gettext is not on crates.io yet; nothing to compare with"
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: steps.published.outputs.exists == 'true'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9

  audit:
    name: Audit
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    uses: ./.github/workflows/audit.yml

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; one that writes CHANGELOG.md, as a
  # release does, must write exactly what the fragments make. It runs on every
  # change: the fragments are Markdown, which no domain counts, and the check
  # takes seconds.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ] && git diff --name-only HEAD^1 HEAD | grep -qx CHANGELOG.md; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # Always runs: the workflows are checked wherever the change is, and the
  # image bundles shellcheck for the `run:` scripts.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  # The one status the ruleset requires. Skipped jobs are domains the change
  # does not touch and pass; anything failed or cancelled fails it.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, format, rust, msrv, package, semver, audit, changelog, actionlint]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key] | join(" ")')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $bad"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────
  #
  # Main only, after `Checks`, and only for a release. `checks` runs whatever
  # its needs did, so every job here states the results it depends on rather
  # than relying on the default, which would skip it whenever any job upstream
  # was skipped.

  # Before the GitHub release: a version on crates.io cannot be taken back, so
  # a failure here leaves nothing tagged for a manual run to trip over.
  # Publishing errors on a version already out, so a re-run checks the index
  # first. The token is minted by crates.io trusted publishing for this
  # workflow alone and expires within the hour, so no registry secret is kept.
  # `package` has already built this commit's crate as crates.io will see it,
  # so the upload skips that build.
  crates:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, checks]
    if: ${{ !cancelled() && needs.changes.result == 'success' && needs.checks.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.changes.outputs.release == 'true' }}
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: index
        run: |
          if curl -sf https://index.crates.io/as/ka/askama_gettext | grep -q "\"vers\":\"${VERSION}\""; then
            echo "askama_gettext ${VERSION} is already on crates.io"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.index.outputs.published == 'false'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable
        with:
          toolchain: stable
      - id: auth
        if: steps.index.outputs.published == 'false'
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - if: steps.index.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify

  # Creates the tag through the API, on the commit that was published. The
  # notes are the version's section of CHANGELOG.md.
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, crates]
    if: ${{ !cancelled() && needs.crates.result == 'success' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release notes
        env:
          VERSION: ${{ needs.changes.outputs.version }}
        run: |
          awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md > notes.md
          if ! grep -q . notes.md; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          printf '\nhttps://crates.io/crates/askama_gettext/%s\n' "$VERSION" >> notes.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.changes.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.changes.outputs.version }}
          body_path: notes.md
